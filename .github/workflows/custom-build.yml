name: Build Telegram iOS (Unsigned IPA)

on:
  workflow_dispatch: # Запуск вручную по кнопке в интерфейсе GitHub

jobs:
  build:
    runs-on: macos-latest # Облачный Mac для сборки
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Init submodules from upstream
        run: |
          git config --global url."https://github.com".insteadOf "https://github.com"
          git submodule update --init --recursive --depth 1
          
      - name: Check Xcode and tools
        run: |
          xcodebuild -version
          python3 --version

      - name: Create Configuration JSON
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          mkdir -p build-input
          cat << EOF > build-input/configuration.json
          {
            "bundle_id": "org.telegram.Telegram-iOS",
            "api_id": "$API_ID",
            "api_hash": "$API_HASH",
            "team_id": "",
            "app_center_id": "",
            "is_internal_build": "true",
            "is_appstore_build": "false",
            "appstore_id": "686449807",
            "app_specific_url_scheme": "tg",
            "premium_iap_product_id": "",
            "enable_siri": false,
            "enable_icloud": false
          }
          EOF

      - name: Build Unsigned IPA via Make.py
        run: |
          python3 build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath="build-input/configuration.json" \
            --buildNumber=10000 \
            --configuration=release_arm64

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find bazel-bin -name "Telegram.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r Telegram-Custom.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Custom-IPA
          path: Telegram-Custom.ipa
