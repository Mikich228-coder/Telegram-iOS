workflows:
  ios-custom-build:
    name: Build Telegram iOS (Unsigned IPA)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - telegram_keys
      xcode: latest
    scripts:
      - name: Init submodules from upstream
        script: |
          rm -f ~/.gitconfig
          git config --global url."https://github.com".insteadOf "https://github.com"
          git remote set-url origin https://github.comTelegram-iOS.git
          git submodule sync
          git submodule update --init --depth 1
          TGCALLS_REV=$(git -C submodules/TgVoipWebrtc ls-tree HEAD tgcalls | awk '{print $3}')
          git -c submodule.tgcalls.update=none submodule update --init --recursive --depth 1
          rm -rf submodules/TgVoipWebrtc/tgcalls
          git clone https://github.comtgcalls.git submodules/TgVoipWebrtc/tgcalls || git clone https://github.com submodules/TgVoipWebrtc/tgcalls
          git -C submodules/TgVoipWebrtc/tgcalls checkout "$TGCALLS_REV" || true

      - name: Create Configuration JSON
        script: |
          mkdir -p build-input
          cat << EOF > build-input/configuration.json
          {
            "bundle_id": "org.telegram.Telegram-iOS",
            "api_id": $TELEGRAM_API_ID,
            "api_hash": "$TELEGRAM_API_HASH",
            "team_id": "",
            "app_center_id": "",
            "is_internal_build": "true",
            "is_appstore_build": "false",
            "appstore_id": "686449807",
            "app_specific_url_scheme": "tg",
            "premium_iap_product_id": "",
            "enable_siri": false,
            "enable_icloud": false
          }
          EOF

      - name: Build Unsigned IPA via Make.py
        script: |
          python3 build-system/Make/Make.py --cacheDir="$HOME/telegram-bazel-cache" --overrideXcodeVersion build --configurationPath="build-input/configuration.json" --buildNumber=10000 --configuration=release_arm64 --xcodeManagedCodesigning

      - name: Package Payload into IPA
        script: |
          mkdir -p Payload
          APP_PATH=$(find bazel-bin -name "Telegram.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r Telegram-Custom.ipa Payload

    artifacts:
      - Telegram-Custom.ipa
